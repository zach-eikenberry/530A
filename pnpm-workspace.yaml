packages:
  - packages/*
  - apps/*
  - e2e
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260713.1'
# Force patched versions of vulnerable transitive deps (pnpm audit gate).
overrides:
  'fast-uri@>=3.0.0 <3.1.4': '^3.1.4'
  'sharp@<0.35.0': '^0.35.0'
  'postcss@<8.5.18': '^8.5.18'
  'brace-expansion@<1.1.17': '^1.1.17'
  'brace-expansion@>=2.0.0 <2.1.3': '^2.1.3'
  'brace-expansion@5.0.7': '5.0.9'
